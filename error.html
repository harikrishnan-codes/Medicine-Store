<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | MEDIXEN</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <link rel="icon" href="./assets/logo.webp" />

    <!-- Root Variables & Page Styles -->
    <link rel="stylesheet" href="root.css" />
    <link rel="stylesheet" href="error.css" />
</head>

<body>

    <!-- Floating Background Medical Elements -->
    <div class="floating-bg" aria-hidden="true">
        <div class="floating-item float-1"><i class="fa-solid fa-stethoscope"></i></div>
        <div class="floating-item float-2"><i class="fa-solid fa-capsules"></i></div>
        <div class="floating-item float-3"><i class="fa-solid fa-syringe"></i></div>
        <div class="floating-item float-4"><i class="fa-solid fa-kit-medical"></i></div>
    </div>

    <main class="error-wrapper">
        <div class="error-container">

            <!-- Top Medical Badge -->
            <!-- Brand Logo with 404 Status Badge -->
            <div class="error-top-brand">
                <a href="index.html" class="brand-logo">
                    <img src="./assets/logo 12.webp" alt="logo" width="150px" height="50px">
                </a>

                <div class="error-badge">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Diagnosis Code: 404</span>
                </div>
            </div>

            <!-- Animated Graphic Section -->
            <div class="error-visual">
                <span class="digit digit-left">4</span>

                <!-- Center Monitor Graphic -->
                <div class="monitor-screen">
                    <div class="screen-glare"></div>
                    <div class="monitor-header">
                        <span class="status-dot"></span>
                        <span class="monitor-title">ECG SIGNAL</span>
                    </div>

                    <svg class="heartbeat-svg" viewBox="0 0 200 80">
                        <!-- Normal Waveform leading into a Flatline -->
                        <path class="wave-path" d="M0,40 L40,40 L50,15 L60,65 L70,25 L80,50 L90,40 L200,40" />
                    </svg>

                    <div class="monitor-footer">
                        <span class="status-text">NO PULSE FOUND</span>
                        <span class="bpm-text">0 BPM</span>
                    </div>
                </div>

                <span class="digit digit-right">4</span>
            </div>

            <!-- Copy & Actions -->
            <div class="error-content">
                <h1 class="error-title">Page Vital Signs Lost</h1>
                <p class="error-desc">
                    We couldn't detect the equipment or page you are looking for. It might have been relocated,
                    decommissioned, or never existed in our facility.
                </p>

                <div class="error-actions">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fa-solid fa-house-medical"></i> Return to Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary">
                        <i class="fa-solid fa-boxes-stacked"></i> Go Back
                    </a>
                </div>
            </div>

        </div>
    </main>

    <!-- GSAP Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>

        document.addEventListener("DOMContentLoaded", () => {
            // GSAP Main Entrance Timeline
            const tl = gsap.timeline({defaults: {ease: "power3.out"}});

            tl.from(".error-container", {
                scale: 0.9,
                y: 30,
                opacity: 0,
                duration: 0.8
            })
                .from(".error-badge", {
                    y: -15,
                    opacity: 0,
                    duration: 0.4
                }, "-=0.4")
                .from(".digit-left", {
                    x: -40,
                    opacity: 0,
                    duration: 0.6
                }, "-=0.3")
                .from(".digit-right", {
                    x: 40,
                    opacity: 0,
                    duration: 0.6
                }, "<")
                .from(".monitor-screen", {
                    scale: 0.7,
                    opacity: 0,
                    duration: 0.5,
                    ease: "back.out(1.7)"
                }, "-=0.4")
                .to(".wave-path", {
                    strokeDashoffset: 0,
                    duration: 1.2,
                    ease: "power2.inOut"
                })
                .from(".error-title, .error-desc", {
                    y: 20,
                    opacity: 0,
                    stagger: 0.1,
                    duration: 0.5
                }, "-=0.4")
                .from(".error-actions .btn", {
                    y: 20,
                    opacity: 0,
                    stagger: 0.1,
                    duration: 0.4,
                    clearProps: "all"
                }, "-=0.3");

            // Red Heartbeat / Alert Dot Blinking Animation
            gsap.to(".status-dot", {
                opacity: 0.2,
                duration: 0.6,
                repeat: -1,
                yoyo: true,
                ease: "power1.inOut"
            });

            // Continuous Subtle Float for Background Icons
            gsap.utils.toArray(".floating-item").forEach((item, index) => {
                gsap.to(item, {
                    y: index % 2 === 0 ? -18 : 18,
                    rotation: index % 2 === 0 ? 12 : -12,
                    duration: 3 + index,
                    repeat: -1,
                    yoyo: true,
                    ease: "sine.inOut"
                });
            });

            tl.from(".error-top-brand", {
                y: -20,
                opacity: 0,
                duration: 0.5
            })

        });

    </script>

</body>

</html>
